function settings(){let themes=[["royal","أسود ملكي"],["pearl","لؤلؤي فاتح"],["blue","أزرق احترافي"],["wood","خشبي نحاسي"]];return '<div class="card"><h3>المظهر</h3><div class="row">'+themes.map(x=>btn(x[1],"theme:"+x[0],state.theme===x[0]?"primary":"secondary")).join("")+'</div><div class="separator"></div><h3>كهرباء الليزر</h3><p>القدرة الكهربائية (واط): <b>'+esc(state.prefs.watts)+'</b></p><p>سعر الكيلوواط ساعة: <b>'+usd(state.prefs.kwh)+'</b></p>'+btn("تعديل حساب الكهرباء","electric")+'</div><div class="card" style="margin-top:12px"><h3>الحساب والمزامنة</h3><p class="muted">'+esc(user?.email||"")+'</p><p class="muted small">تحتاج إنترنت لحفظ التعديلات. لا تدعم هذه النسخة إدخال طلبات دون اتصال. بياناتك لا تُعرض لأشخاص آخرين.</p>'+btn("تنزيل نسخة احتياطية للسجلات والملفات","backupAll","primary")+'<p class="muted small">النسخة تشمل البيانات والمرفقات الموجودة بالسحابة. احفظ ملف ZIP بنسخة ثانية خارج الجهاز. يلزم إنترنت للحفظ والتحميل.</p>'+btn("تحديث البيانات","refresh")+btn("تسجيل خروج","logout")+'</div>'}

function pickMaterial(){if(!list("materials").length){notify("سجّل مادة في المخزون أولاً",true);return}let host=byId("orderAddMaterial"),form=byId("dialogForm");let old=byId("materialPicker");if(old){old.remove();return}let wrap=document.createElement("div");wrap.id="materialPicker";wrap.className="card";wrap.innerHTML=selectField("pick_id","المادة",list("materials").map(m=>[m.id,m.name]))+'<div id="measures"></div><button type="button" class="primary" id="confirmLine">إضافة للطلب</button>';host.insertAdjacentElement("afterend",wrap);
function draw(){let m=one("materials",wrap.querySelector('[name="pick_id"]').value),w=isWood(m);byId("measures").innerHTML=w?'<div class="fields">'+field("width","عرض القص (سم)","number","15",'step=".01" min=".01"')+field("length","طول القص (سم)","number","15",'step=".01" min=".01"')+field("count","عدد القطع","number","1",'step="1" min="1"')+'</div>':'<div class="fields">'+field("amount","الكمية المستخدمة ('+esc(m.unit)+')","number","1",'step=".01" min=".01"')+'</div><p class="small muted">المتوفر: '+fx(m.quantity_on_hand)+' '+esc(m.unit)+'</p>'}
wrap.querySelector('[name="pick_id"]').onchange=draw;draw();byId("confirmLine").onclick=()=>{let m=one("materials",wrap.querySelector('[name="pick_id"]').value),ln={material_id:m.id,name:m.name,unit:m.unit},w=isWood(m);if(w){ln.width=N(wrap.querySelector('[name="width"]').value);ln.length=N(wrap.querySelector('[name="length"]').value);ln.count=N(wrap.querySelector('[name="count"]').value);if(ln.width<=0||ln.length<=0||ln.count<=0||!Number.isInteger(ln.count))return notify("راجع العرض والطول والعدد",true);ln.amount=round((ln.width+N(specs(m).kerf_mm)/10)*(ln.length+N(specs(m).kerf_mm)/10)*ln.count);try{allocateWood(specs(m),[ln])}catch(e){return err(e)}}else{ln.amount=N(wrap.querySelector('[name="amount"]').value);if(ln.amount<=0||ln.amount>N(m.quantity_on_hand))return notify("الكمية غير متوفرة",true)}ln.unit_cost=w?N(m.package_price)/(N(specs(m).width_cm)*N(specs(m).height_cm)):priceEach(m);ln.cost=matLineCost(m,ln);state.pendingLines.push(ln);wrap.remove();refreshDraft()}}
function viewOrder(id){let o=one("orders",id);if(!o)return;let lines=(o.cost_breakdown||[]).map(l=>'<div class="line-row">'+esc(l.name)+' '+(l.width?l.width+'×'+l.length+' سم × '+l.count:l.amount?fx(l.amount)+" "+esc(l.unit):"")+' <b style="float:left">'+usd(l.cost)+'</b></div>').join("");let h='<p><b>رقم الطلب: LP'+esc(o.id.slice(0,8).toUpperCase())+'</b></p><p><b>'+esc(o.product_snapshot?.name||"")+'</b> — '+esc(o.customer_snapshot?.name||"")+'</p><p>هاتف: '+esc(o.customer_snapshot?.phone||"—")+' • عنوان: '+esc(o.customer_snapshot?.address||"—")+'</p><p>ملاحظات: '+esc(o.notes||"—")+'</p><p>البيع: '+usd(o.price)+' • التكلفة: '+usd(matsCost(o))+' • الربح: <b>'+usd(N(o.price)-matsCost(o))+'</b></p><p>المقبوض: '+usd(paid(id))+' • المتبقي: '+usd(N(o.price)-paid(id))+'</p><h3>المواد والكهرباء</h3>'+lines+'<p class="muted small">'+(o.inventory_confirmed?"✓ المواد خُصمت من المخزون":"المواد لم تُخصم بعد")+'</p><div class="row">'+(o.inventory_confirmed?"":btn("تأكيد الاستهلاك","confirmInventory:"+id,"primary"))+btn("سجل قبض","payment:"+id)+btn("تسليم","delivery:"+id)+btn("تغيير الحالة","status:"+id)+'</div><p class="muted small">ملاحظة: ما فينا نغيّر مواد طلب بعد تأكيد خصمها حتى ما نخصم مرتين.</p>';modal("تفاصيل الطلب",h,async()=>{}, "إغلاق");byId("saveModal").onclick=e=>{e.preventDefault();byId("closeModal").click()}}
async function confirmInventory(id){let o=one("orders",id);if(!o||o.inventory_confirmed)return notify("المواد خُصمت مسبقاً");if(!confirm("تأكيد قص/استهلاك المواد لهذا الطلب؟ هالعملية بتخصم مرة واحدة."))return;let groups=new Map();for(let line of o.cost_breakdown||[]){if(!line.material_id)continue;let g=groups.get(line.material_id)||[];g.push(line);groups.set(line.material_id,g)}if(!groups.size)return notify("لا مواد مسجلة في الطلب",true);let updates=[];for(const[mid,lines]of groups){let m=one("materials",mid);if(!m)throw Error("المادة غير موجودة: "+lines[0].name);if(isWood(m)){if(lines.some(x=>N(x.width)<=0||N(x.length)<=0||N(x.count)<=0))throw Error("هيدا طلب قديم بلا قياسات خشب، ما فينا نخصمه من اللوح من دون عرض وطول صحيحين.");let before=specs(m),after=allocateWood(before,lines.map(x=>({...x,orderId:id})));updates.push({material_id:mid,wood:true,before_spec:before,after_spec:after,remaining_panels:after.boards.filter(b=>freeArea(b)>.01).length,amount:round(lines.reduce((s,x)=>s+N(x.amount),0)),unit_cost:N(m.package_price)/(N(before.width_cm)*N(before.height_cm))})}else{let amount=lines.reduce((s,x)=>s+N(x.amount),0);if(amount>N(m.quantity_on_hand))throw Error("مخزون غير كافٍ: "+m.name);updates.push({material_id:mid,wood:false,amount,unit_cost:priceEach(m)})}}let {data,error}=await SB.rpc("lp_commit_order_inventory",{p_order_id:id,p_updates:updates});if(error)throw error;notify(data.status==="already_confirmed"?"المواد مخصومة مسبقاً":"تم تحديث المخزون وإثبات الاستهلاك");byId("closeModal")?.click();await loadAll();render()}
function paymentForm(id){let o=one("orders",id),remain=N(o.price)-paid(id),op=uid();modal("تسجيل قبض — "+o.customer_snapshot?.name,'<div class="fields">'+field("amount","المبلغ المقبوض ($)","number",Math.max(remain,0),'required min=".01" step=".01"')+selectField("method","طريقة القبض",[["نقدي","نقدي"],["Whish","Whish"],["OMT","OMT"],["تحويل","تحويل"],["غيره","غيره"]])+field("date","التاريخ","date",today())+textarea("note","ملاحظة")+'</div>',async f=>{let amt=N(f.get("amount"));if(amt<=0)throw Error("المبلغ غير صحيح");const {data,error}=await SB.rpc("lp_daily_record_payment",{p_order_id:id,p_amount:amt,p_method:String(f.get("method")),p_paid_at:new Date(f.get("date")+"T12:00:00").toISOString(),p_note:String(f.get("note")||""),p_operation_key:op});if(error)throw error;notify(data?.status==="already_saved"?"القبض كان مسجلاً مسبقاً":"تم تسجيل القبض بالسحابة")})}
function deliveryForm(id){modal("تسليم الطلب",'<div class="fields">'+selectField("method","طريقة التسليم",[["يد بيد","يد بيد"],["دليفري","دليفري"],["استلام من المحل","استلام من المحل"]])+field("date","تاريخ التسليم","date",today())+field("recipient","المستلم","text","")+textarea("note","ملاحظات")+'</div>',async f=>{const {data,error}=await SB.rpc("lp_daily_record_delivery",{p_order_id:id,p_method:String(f.get("method")),p_delivered_at:new Date(f.get("date")+"T12:00:00").toISOString(),p_recipient:String(f.get("recipient")||""),p_note:String(f.get("note")||"")});if(error)throw error;notify(data?.status==="already_delivered"?"التسليم كان مسجلاً مسبقاً":"تم تسجيل التسليم بأمان، حتى لو بقي مبلغ للقبض")})}
function changeStatus(id){let o=one("orders",id);modal("حالة الطلب",selectField("status","الحالة",[["new","جديد"],["working","قيد التنفيذ"],["ready","جاهز"],["cancelled","ملغي"]],o.status),async f=>{let selected=String(f.get("status"));if(selected==="cancelled"&&(o.inventory_confirmed||paid(id)>0))throw Error("لا يمكن إلغاء طلب خُصمت مواده أو قُبضت منه دفعات قبل تسوية المواد والمبالغ.");if(o.status==="delivered")throw Error("الطلب مسلّم بالفعل. لا تغيّر حالته من هذه الشاشة.");await save("orders",{status:selected},id)})}
function uploadFile(){modal("حفظ SVG أو صورة",'<div class="fields">'+field("name","اسم الملف/الحزمة","text","",'required')+field("category","المجلد / التصنيف","text","عام")+textarea("notes","ملاحظات")+'<label class="field wide"><span>ملف SVG أو صورة أو PDF (لحد 50 MB)</span><input id="theFile" type="file" accept=".svg,.png,.jpg,.jpeg,.webp,.pdf" required></label></div>',async f=>{let file=byId("theFile")?.files?.[0];if(!file)throw Error("اختار ملف");if(file.size>50000000)throw Error("حجم الملف كبير");let ext=file.name.split(".").pop()?.toLowerCase(),allowed=["svg","png","jpg","jpeg","webp","pdf"];if(!allowed.includes(ext))throw Error("امتداد الملف غير مدعوم");let pathname=user.id+"/"+uid()+"."+ext;let {error}=await SB.storage.from("laser-pro-files").upload(pathname,file,{upsert:false,contentType:file.type||(ext==="svg"?"image/svg+xml":"application/octet-stream")});if(error)throw error;try{await save("files",{name:f.get("name"),category:f.get("category"),notes:f.get("notes"),storage_path:pathname})}catch(e){await SB.storage.from("laser-pro-files").remove([pathname]);throw e}notify("الملف انحفظ بالسحابة")})}
async function openFile(id){let f=one("files",id);if(!f?.storage_path)return notify("الملف مش موجود",true);let {data,error}=await SB.storage.from("laser-pro-files").createSignedUrl(f.storage_path,300,{download:f.name||"laser-pro-file"});if(error)throw error;window.open(data.signedUrl,"_blank","noopener,noreferrer")}
function purchaseForm(){modal("مشتريات قبل تأسيس Laser Pro",'<div class="fields">'+field("item","المشتريات","text","",'required')+field("price","السعر ($)","number","0",'step=".01" min="0"')+field("date","تاريخ الشراء","date",today())+field("seller","البائع","text","")+field("category","الفئة","text","")+textarea("notes","ملاحظات")+'</div>',async f=>{await save("purchases",{item_name:f.get("item"),price:N(f.get("price")),purchased_on:f.get("date"),seller:f.get("seller"),category:f.get("category"),notes:f.get("notes")})})}
async function savePrefs(){state.prefs.theme=state.theme;let {error}=await SB.from("lp_user_settings").upsert({owner_id:user.id,prefs:state.prefs,updated_at:new Date().toISOString()});if(error)throw error}
function electricForm(){modal("إعدادات كهرباء الليزر",'<div class="fields">'+field("watts","قدرة الجهاز الفعلية (واط)","number",state.prefs.watts,'min="0" step=".1"')+field("kwh","سعر الكهرباء لكل kWh بالدولار","number",state.prefs.kwh,'min="0" step=".01"')+'</div>',async f=>{state.prefs.watts=N(f.get("watts"));state.prefs.kwh=N(f.get("kwh"));await savePrefs()})}
async function backupAll(){if(state.backupRunning)return;state.backupRunning=true;try{
 if(!window.JSZip)throw Error("تعذّر تحميل أداة النسخ الاحتياطي. تأكد من الإنترنت وأعد المحاولة");
 notify("عم نحضّر نسخة احتياطية من السجلات والملفات…");
 const data={};for(const name of Object.keys(TABLES)){let all=[];for(let offset=0;offset<200000;offset+=1000){const r=await SB.from(TABLES[name]).select("*").order("created_at",{ascending:false}).range(offset,offset+999);if(r.error)throw r.error;all.push(...(r.data||[]));if(!r.data||r.data.length<1000)break}data[name]=all}
 const pref=await SB.from("lp_user_settings").select("*").eq("owner_id",user.id);if(pref.error)throw pref.error;
 const zip=new JSZip();zip.file("LaserPro-data.json",JSON.stringify({app:"Laser Pro Daily",version:1,exported_at:new Date().toISOString(),user_id:user.id,tables:data,user_settings:pref.data||[]},null,2));
 let total=0;const attachments=data.files.filter(x=>x.storage_path);
 for(const f of attachments){const path=f.storage_path;if(!path.startsWith(user.id+"/"))throw Error("مرفق بمسار مختلف: "+f.name);
 const x=await SB.storage.from("laser-pro-files").download(path);if(x.error)throw x.error;
 total+=x.data.size;if(total>160*1024*1024)throw Error("ملفاتك فوق 160MB. افتح النظام من اللابتوب وصدّر الملفات على دفعات. لم نسمّ هذه نسخة مكتملة.");
 zip.file("مرفقات/"+path.split("/").pop(),x.data)}
 const blob=await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:2}});
 const link=document.createElement("a"),u=URL.createObjectURL(blob);link.href=u;link.download="LaserPro-Daily-Backup-"+today()+".zip";document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);notify("اكتمل تجهيز ملف النسخة الاحتياطية. احفظه بمكان آمن خارج الهاتف.");
 }catch(e){err(e)}finally{state.backupRunning=false}}
function exportCsv(){const head=["الزبون","المنتج","السعر","التكلفة","الربح","المقبوض","المتبقي","الحالة"];let rows=list("orders").map(o=>[o.customer_snapshot?.name,o.product_snapshot?.name,N(o.price),matsCost(o),round(N(o.price)-matsCost(o)),paid(o.id),round(N(o.price)-paid(o.id)),status(o.status)]);let csv="\uFEFF"+[head,...rows].map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="LaserPro-Orders-"+today()+".csv";a.click();URL.revokeObjectURL(a.href)}
async function handleAct(act){try{if(act==="refresh"){await loadAll();render();return}if(act==="newCustomer")return genericCustomer();if(act.startsWith("editCustomer:"))return genericCustomer(act.slice(13));if(act==="newProduct")return genericProduct();if(act.startsWith("editProduct:"))return genericProduct(act.slice(12));if(act==="newMaterial")return genericMaterial();if(act.startsWith("editMaterial:"))return genericMaterial(act.slice(13));if(act==="newOrder")return addOrder();if(act.startsWith("viewOrder:"))return viewOrder(act.slice(10));if(act.startsWith("confirmInventory:"))return await confirmInventory(act.slice(17));if(act.startsWith("payment:"))return paymentForm(act.slice(8));if(act.startsWith("delivery:"))return deliveryForm(act.slice(9));if(act.startsWith("status:"))return changeStatus(act.slice(7));if(act==="uploadFile")return uploadFile();if(act.startsWith("openFile:"))return await openFile(act.slice(9));if(act==="newPurchase")return purchaseForm();if(act.startsWith("theme:")){state.theme=act.slice(6);document.body.dataset.theme=state.theme;await savePrefs();return render()}if(act==="electric")return electricForm();if(act==="exportCsv")return exportCsv();if(act==="backupAll")return backupAll();if(act==="logout"){await SB.auth.signOut();user=null;return loginScreen()}}catch(e){err(e)}}
function render(){if(!user)return loginScreen();shell()}
document.addEventListener("click",e=>{let t=e.target.closest("[data-act]");if(t)return handleAct(t.dataset.act);let nav=e.target.closest("[data-tab]");if(nav){state.tab=nav.dataset.tab;state.kw="";render()}});
(async()=>{if(!SB)return loginScreen();let {data,error}=await SB.auth.getSession();if(error)console.error(error);user=data?.session?.user||null;if(user){try{await loadAll();render()}catch(e){err(e);loginScreen()}}else loginScreen();SB.auth.onAuthStateChange(async(event,session)=>{if(event==="SIGNED_OUT"){user=null;loginScreen()}})})();
</script></body></html>
