name: Publish Laser Pro Browser App
on:
  push:
    branches: [main]
    paths:
      - 'laser-pro-studio/**'
      - 'laser-pro-original/**'
      - '.github/workflows/publish-laser-pro.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: laser-pro-pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated site
        shell: bash
        run: |
          mkdir -p _site/laser-pro-studio
          cp laser-pro-studio/index.html _site/laser-pro-studio/index.html
          mkdir -p _site/laser-pro-original
          cp laser-pro-original/index.html laser-pro-original/theme.css laser-pro-original/sw.js laser-pro-original/manifest.webmanifest laser-pro-original/icon-192.png _site/laser-pro-original/
          node -e "const fs=require('fs'); for(const f of ['laser-pro-studio/index.html','laser-pro-original/index.html']){let s=fs.readFileSync(f,'utf8'); const js=s.match(/<script>([\\s\\S]*?)<\\/script>/); if(!js)throw Error('Script not found: '+f);new Function(js[1]);}"
          touch _site/.nojekyll
          test -s _site/laser-pro-studio/index.html
          test -s _site/laser-pro-original/index.html
          test -s _site/laser-pro-original/theme.css
          test -s _site/laser-pro-original/icon-192.png
      - name: Install browser test dependencies
        shell: bash
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test classic Laser Pro on mobile and desktop
        shell: bash
        run: |
          python3 -m http.server 8765 --directory _site > /tmp/laser-pro-web.log 2>&1 &
          sleep 2
          node laser-pro-original/smoke.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload web page
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy live website
        id: deploy
        uses: actions/deploy-pages@v4
